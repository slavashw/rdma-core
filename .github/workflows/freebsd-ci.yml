name: FreeBSD Build

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

env:
  FREEBSD_IMAGE_URL: https://github.com/slavashw/freebsd-builder/releases/download/v15.1.0/freebsd-15.1-x86-64.qcow2

jobs:
  build-freebsd:
    runs-on: ubuntu-latest
    name: Build rdma-core on FreeBSD
    defaults:
      run:
        shell: cpa.sh {0}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify BYO image URL is reachable
        shell: bash
        run: |
          curl -fIL --retry 3 --range 0-0 "${FREEBSD_IMAGE_URL}"

      - name: Start FreeBSD VM
        uses: cross-platform-actions/action@v1.3.0
        with:
          operating_system: freebsd
          version: '15.1'
          architecture: x86-64
          image_url: ${{ env.FREEBSD_IMAGE_URL }}

      - name: Smoke test in FreeBSD VM
        run: |
          uname -a
          sysctl hw.ncpu
          sysctl hw.physmem
          sysctl hw.usermem
